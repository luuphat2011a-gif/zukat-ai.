
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Zukat AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      background: #111a30;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #91a2ff;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 12px;
    }

    main {
      min-height: 78vh;
      padding: 30px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 { font-size: 36px; }

    p {
      color: #c0cbe5;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      margin: 8px 4px;
      background: #7185ff;
      color: white;
      border: 0;
      border-radius: 25px;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 25px;
    }

    .feature {
      width: 130px;
      padding: 18px 8px;
      background: #151f38;
      border: 1px solid #293654;
      border-radius: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #8995b5;
    }

    #openBotpress {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 99999;
      width: 62px;
      height: 62px;
      border: none;
      border-radius: 50%;
      background: #7185ff;
      color: white;
      font-size: 32px;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>

  <!-- Botpress: giữ đúng mã của bạn -->
  <script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/10/11/03/20261011032028-NA7MEZJA.js" defer></script>
</head>

<body>
  <header>
    <div class="logo">✧ Zukat AI</div>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="chat.html">Trò chuyện</a>
    </nav>
  </header>

  <main>
    <h1>Chào mừng đến Zukat AI ✧</h1>

    <p>
      Trợ lý AI đồng hành cùng bạn.<br>
      Hỏi đáp, học tập và khám phá kiến thức mới.
    </p>

    <div>
      <button class="btn" id="startChat" type="button">
        ✧ Bắt đầu trò chuyện
      </button>

      <a class="btn" href="chat.html">Trang chat riêng</a>
    </div>

    <div class="features">
      <div class="feature">📚<p>Học tập</p></div>
      <div class="feature">💡<p>Giải đáp</p></div>
      <div class="feature">✍️<p>Viết nội dung</p></div>
    </div>
  </main>

  <footer>Zukat AI · Trợ lý AI của bạn</footer>

  <button id="openBotpress" type="button" aria-label="Mở chatbot">
    ✧
  </button>

  <script>
    function openZukatChat() {
      if (
        window.botpress &&
        typeof window.botpress.open === "function"
      ) {
        window.botpress.open();
      } else {
        alert(
          "Nút Zukat hoạt động! Nhưng Botpress chưa sẵn sàng. " +
          "Hãy kiểm tra Embed code và cấu hình Webchat."
        );
      }
    }

    document.getElementById("openBotpress")
      .addEventListener("click", openZukatChat);

    document.getElementById("startChat")
      .addEventListener("click", openZukatChat);
  </script>
</body>
</html>
